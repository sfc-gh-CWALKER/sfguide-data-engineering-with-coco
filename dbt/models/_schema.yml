version: 2

models:
  - name: customers
    columns:
      - name: customer_key
        tests: [not_null, unique]
  - name: orders_summary
    columns:
      - name: order_key
        tests: [not_null, unique]
      - name: order_status
        tests:
          - accepted_values:
              arguments:
                values: ['F', 'O', 'P']
  - name: supplier_performance
    columns:
      - name: supplier_key
        tests: [not_null, unique]
